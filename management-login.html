0 1px 0 rgba(255,255,255,.05)!important;backdrop-filter:blur(20px) saturate(140%)!important;-webkit-backdrop-filter:blur(20px) saturate(140%)!important;color:var(--nova-text)!important;position:relative!important;overflow:hidden!important}.card::before{content:""!important;position:absolute!important;left:0;right:0;top:0;height:2px;background:linear-gradient(90deg,var(--nova-accent),var(--nova-accent-2),var(--nova-accent-3))!important}.card .logo,.logo{background:#04070E!important;overflow:hidden!important;border:1px solid rgba(0,229,192,.30)!important;box-shadow:0 14px 34px rgba(0,229,192,.18)!important}.card .logo img,.logo img{width:100%!important;height:100%!important;object-fit:cover!important}.eyebrow{color:var(--nova-accent)!important;letter-spacing:.2em!important;font-weight:700!important}.title,.card h1{color:#FFFFFF!important;font-weight:720!important;letter-spacing:-.03em!important}.sub,.hint{color:var(--nova-muted)!important}label{color:var(--nova-text-2)!important;font-weight:600!important}@media(max-width:900px){body{background:#070B14!important;align-items:flex-start!important}.shell{background:rgba(14,22,38,.86)!important;border:1px solid var(--nova-border-2)!important;box-shadow:0 26px 70px rgba(2,6,16,.7)!important}.login-panel{background:transparent!important;border-radius:26px!important}.login-card:before{background:url('/assets/nova-logo.png?v=nova-1') center/contain no-repeat!important;border-radius:22px!important;box-shadow:0 18px 40px rgba(0,229,192,.20)!important}.login-head h2{color:#FFFFFF!important}.login-head p{color:var(--nova-muted)!important}.login-head .eyebrow{color:var(--nova-accent)!important}.card .logo{display:block!important}}</style>

<body>
<div class="card">
  <div class="logo"><img src="/assets/nova-logo.png?v=nova-20260728-1" alt="NOVA SMS"></div>
  <div class="eyebrow">Admin Credentials</div>
  <div class="title">Management Panel</div>
  <div class="sub">Maintenance, imports, integrations, rates and system master tools.</div>
  <form id="form">
    <div class="field"><label>Admin Username</label><input id="username" autocomplete="username" required></div>
    <div class="field"><label>Admin Password</label><input id="password" type="password" autocomplete="current-password" required></div>
    <button type="submit">Sign In</button>
    <div class="msg" id="msg"></div>
  </form>
  <div class="hint">Uses Admin account. This panel is separate from daily Admin operations.</div>
</div>
<script>
function msg(t,c){const m=document.getElementById('msg');m.textContent=t;m.className='msg show '+c;}
document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();msg('Checking...','success');try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:username.value.trim(),password:password.value})});const data=await r.json().catch(()=>({}));if(!r.ok)throw new Error(data.error||'Login failed');if(data.user.role!=='admin')throw new Error('Management Panel requires Admin account.');sessionStorage.setItem('ms_token',data.token);sessionStorage.setItem('ms_role',data.user.role);sessionStorage.setItem('ms_user',data.user.username);sessionStorage.setItem('ms_name',data.user.name||data.user.username);localStorage.setItem('ms_token',data.token);localStorage.setItem('ms_role',data.user.role);localStorage.setItem('ms_user',data.user.username);localStorage.setItem('ms_name',data.user.name||data.user.username);localStorage.setItem('ms_last_page_management','rates');location.href='/management';}catch(err){msg('❌ '+err.message,'error');}});
</script>
</body>
