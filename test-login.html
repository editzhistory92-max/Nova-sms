<style>
*{box-sizing:border-box;margin:0;padding:0}body{min-height:100vh;font-family:Inter,Segoe UI,system-ui,sans-serif;background:#f8fafc;color:#0f2454;display:flex;align-items:center;justify-content:center;padding:18px}.card{width:min(420px,100%);background:#fff;border:1px solid #e2e8f0;border-radius:24px;box-shadow:0 24px 70px rgba(15,23,42,.14);padding:30px}.logo{width:84px;height:84px;margin:0 auto 18px;border-radius:20px;overflow:hidden;background:#050505;border:1px solid rgba(212,175,55,.45)}.logo img{width:100%;height:100%;object-fit:cover}.eyebrow{text-align:center;color:#1d4ed8;text-transform:uppercase;font-size:12px;font-weight:900;letter-spacing:.16em}.title{text-align:center;font-size:30px;font-weight:900;margin:8px 0 4px}.sub{text-align:center;color:#64748b;font-size:14px;margin-bottom:24px}.field{margin-bottom:15px}.field label{display:block;font-size:13px;font-weight:800;margin-bottom:7px}input{width:100%;height:50px;border:1px solid #d7e0ec;border-radius:14px;padding:0 14px;font-size:15px;outline:none}input:focus{border-color:#2563eb;box-shadow:0 0 0 4px rgba(37,99,235,.10)}button{width:100%;height:52px;border:0;border-radius:15px;background:linear-gradient(135deg,#d4af37,#f59e0b);color:#111827;font-weight:950;font-size:15px;cursor:pointer;margin-top:6px}.msg{display:none;margin-top:14px;border-radius:12px;padding:10px;font-size:13px}.msg.show{display:block}.msg.error{background:#fef2f2;color:#991b1b;border:1px solid #fecaca}.msg.success{background:#f0fdf4;color:#166534;border:1px solid #bbf7d0}.hint{text-align:center;margin-top:16px;color:#94a3b8;font-size:12px}@media(max-width:520px){body{align-items:flex-start;padding:12px}.card{border-radius:20px;padding:24px 20px}.logo{display:none}.title{font-size:28px}}
</style>

<style id="mufasa-purple-theme">
  /* ===== MUFASA SMS Purple Theme — matched to new logo ===== */
  :root{
    --mufasa-purple:#7C3AED;
    --mufasa-purple-2:#A855F7;
    --mufasa-purple-3:#C084FC;
    --mufasa-ink:#160826;
    --mufasa-ink-2:#24103A;
    --mufasa-soft:#F5F0FF;
    --mufasa-border:#E9D5FF;
    --mufasa-text:#1F1735;
    --mufasa-muted:#6B5D7D;
  }
  body{background:linear-gradient(180deg,#FBF8FF 0%,#F7F3FF 44%,#F8FAFC 100%)!important;color:var(--mufasa-text)!important;}
  .sidebar,.rail,.appbar{background:linear-gradient(180deg,#0F0618 0%,#1B0A2E 52%,#0B0612 100%)!important;border-right:1px solid rgba(168,85,247,.34)!important;box-shadow:10px 0 30px rgba(76,29,149,.16)!important;}
  .sb-brand,.rail-brand,.brand-text,.appbar-top{background:transparent!important;border-bottom:1px solid rgba(192,132,252,.22)!important;}
  .sb-brand h1,.brand h1,.brand-text h1,.brand-logo h1,.sidebar h1,.appbar h1{color:#FFFFFF!important;font-weight:800!important;letter-spacing:.035em!important;}
  .sb-brand small,.brand small,.brand-text small,.sidebar small,.appbar small{color:#D8B4FE!important;}
  .sb-section,.sb-sec,.sec{color:#A78BFA!important;font-weight:900!important;letter-spacing:.10em!important;}
  .sb-logo,.brand .logo,.rail .logo,.sb-brand .logo,.brand-logo .logo,.logo{background:#14031F!important;border:1px solid rgba(216,180,254,.45)!important;box-shadow:0 14px 32px rgba(168,85,247,.22)!important;overflow:hidden!important;}
  .mufasa-logo-img,.logo img,.login-hero-logo{filter:saturate(1.08) contrast(1.03)!important;}
  .nav-item,.sub-item,.tab,.ritem,.rsubitem,.navtab,.dropitem,.item{color:#DDD6FE!important;background:transparent!important;}
  .nav-item svg,.tab svg,.ritem svg,.navtab svg,.item svg{stroke:currentColor!important;color:inherit!important;}
  .nav-item:hover,.sub-item:hover,.tab:hover,.ritem:hover,.rsubitem:hover,.navtab:hover,.dropitem:hover,.item:hover{background:rgba(168,85,247,.16)!important;color:#FFFFFF!important;}
  .nav-item.active,.tab.active,.ritem.active,.navtab.active,.item.active{background:linear-gradient(135deg,#7C3AED 0%,#A855F7 58%,#C084FC 100%)!important;color:#FFFFFF!important;box-shadow:0 14px 30px rgba(124,58,237,.30)!important;}
  .nav-item.active svg,.tab.active svg,.ritem.active svg,.navtab.active svg,.item.active svg{stroke:#FFFFFF!important;color:#FFFFFF!important;}
  .sub-item.active,.rsubitem.active,.dropitem.active{background:rgba(168,85,247,.22)!important;color:#F5F3FF!important;box-shadow:inset 3px 0 0 #C084FC!important;}
  .topbar,.tb1,.mgr-topbar{background:rgba(255,255,255,.88)!important;border-bottom:1px solid rgba(196,181,253,.50)!important;box-shadow:0 8px 26px rgba(88,28,135,.06)!important;backdrop-filter:blur(16px)!important;}
  .content,.main{background:linear-gradient(180deg,#FBF8FF 0%,#F8FAFC 100%)!important;}
  .page-head h2,.head h2{color:#23133B!important;font-weight:900!important;letter-spacing:-.025em!important;}
  .breadcrumb,.sub,.muted,.clock,.tb-date,.t2,.ps{color:var(--mufasa-muted)!important;}
  .card,.toolbar,.table-wrap{background:rgba(255,255,255,.86)!important;border-color:rgba(196,181,253,.52)!important;box-shadow:0 16px 42px rgba(88,28,135,.07)!important;}
  .card-head h3,.card h3{color:#24103A!important;font-weight:850!important;}
  thead th{background:#F4EDFF!important;color:#35204F!important;border-color:#E9D5FF!important;}
  table td{border-color:#F0E7FF!important;}
  tbody tr:hover td{background:#FAF5FF!important;}
  input,select,textarea{border-color:#DDD6FE!important;background:#FFFFFF!important;color:#211437!important;}
  input:focus,select:focus,textarea:focus{border-color:#A855F7!important;box-shadow:0 0 0 4px rgba(168,85,247,.14)!important;outline:none!important;}
  .btn-blue,.btn-purple,.btn-teal,.btn-rose,.ms-btn.primary,button.btn-gold{background:linear-gradient(135deg,#7C3AED,#A855F7)!important;color:#fff!important;border:0!important;box-shadow:0 12px 26px rgba(124,58,237,.22)!important;}
  .btn-blue:hover,.btn-purple:hover,.btn-teal:hover,.btn-rose:hover,.ms-btn.primary:hover{filter:brightness(1.04)!important;transform:translateY(-1px)!important;}
  .tb-btn,.hamburger,.mgr-topbar-menu{color:#6D5D7E!important;}
  .tb-btn:hover,.hamburger:hover,.mgr-topbar-menu:hover{background:#F3E8FF!important;color:#6D28D9!important;}
  .avatar,.av{background:linear-gradient(135deg,#6D28D9,#A855F7)!important;color:#fff!important;border-color:#DDD6FE!important;}
  .tag,.tag-blue,.tag-green,.tag-amber,.tag-red,.tag-gray,.tag-mgr,.tag-agt,.tag-cli{border-radius:9px!important;box-shadow:none!important;}
  .tag-blue,.tag-mgr{background:#EDE9FE!important;color:#5B21B6!important;border-color:#DDD6FE!important;}
  .cell-money,.payout-rate,.rate-cell,.otp{color:#6D28D9!important;font-weight:900!important;}
  .login-panel,.shell,.card{border-color:rgba(196,181,253,.55)!important;}
  .brand-panel.logo-only-panel{background:radial-gradient(circle at center,#3B0764 0%,#1B0A2E 54%,#08030D 100%)!important;}
  .login-head .eyebrow{color:#7C3AED!important;}
  .btn,.login-panel .btn{background:linear-gradient(135deg,#7C3AED,#A855F7)!important;color:#fff!important;}
  @media(max-width:900px){.sidebar,.rail,.appbar{box-shadow:14px 0 40px rgba(35,10,61,.28)!important;}.content{background:#FBF8FF!important;}}
</style>

</head>
<body>
<div class="card">
  <div class="logo"><img src="/assets/mufasa-logo.png?v=20260714-purple" alt="MUFASA SMS"></div>
  <div class="eyebrow">Dedicated Login</div>
  <div class="title">Test Panel</div>
  <div class="sub">Use test numbers and test OTP monitoring only.</div>
  <form id="form">
    <div class="field"><label>Username</label><input id="username" autocomplete="username" placeholder="test" required></div>
    <div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password" placeholder="test123" required></div>
    <button type="submit">Sign In</button>
    <div class="msg" id="msg"></div>
  </form>
  <div class="hint">Default: test / test123</div>
</div>
<script>
function msg(t,c){const m=document.getElementById('msg');m.textContent=t;m.className='msg show '+c;}
document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();msg('Checking...','success');try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:username.value.trim(),password:password.value})});const data=await r.json().catch(()=>({}));if(!r.ok)throw new Error(data.error||'Login failed');if(data.user.role!=='test')throw new Error('This login is only for Test Panel users.');['ms_token','ms_role','ms_user','ms_name'].forEach(k=>localStorage.removeItem(k));sessionStorage.setItem('ms_token',data.token);sessionStorage.setItem('ms_role',data.user.role);sessionStorage.setItem('ms_user',data.user.username);sessionStorage.setItem('ms_name',data.user.name||data.user.username);localStorage.setItem('ms_last_page_test','dashboard');location.href='/test';}catch(err){msg('❌ '+err.message,'error');}});
</script>
