<script>
  let captchaAnswer = 0;
  function newCaptcha(){const a=Math.floor(Math.random()*9)+1,b=Math.floor(Math.random()*9)+1;captchaAnswer=a+b;document.getElementById('captchaText').textContent=a+' + '+b;document.getElementById('captcha').value='';}
  document.getElementById('refreshCaptcha').addEventListener('click', newCaptcha);newCaptcha();
  const passInput=document.getElementById('password'),togglePass=document.getElementById('togglePass');togglePass.addEventListener('click',()=>{if(passInput.type==='password'){passInput.type='text';togglePass.textContent='Hide';}else{passInput.type='password';togglePass.textContent='Show';}});
  function showMsg(text,type){const m=document.getElementById('msg');m.textContent=text;m.className='msg show '+type;}
  document.getElementById('loginForm').addEventListener('submit',function(e){e.preventDefault();const u=document.getElementById('username').value.trim(),p=document.getElementById('password').value,c=parseInt(document.getElementById('captcha').value,10);if(c!==captchaAnswer){showMsg('❌ Incorrect captcha answer. Please try again.','error');newCaptcha();return;}showMsg('⏳ Verifying...','success');fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p})}).then(async r=>{const data=await r.json();if(!r.ok)throw new Error(data.error||'Login failed');return data;}).then(data=>{try{sessionStorage.setItem('ms_token',data.token);sessionStorage.setItem('ms_role',data.user.role);sessionStorage.setItem('ms_user',data.user.username);sessionStorage.setItem('ms_name',data.user.name||data.user.username);localStorage.setItem('ms_token',data.token);localStorage.setItem('ms_role',data.user.role);localStorage.setItem('ms_user',data.user.username);localStorage.setItem('ms_name',data.user.name||data.user.username);localStorage.setItem('ms_last_page_'+data.user.role,'dashboard');}catch(e){}showMsg('✅ Welcome '+(data.user.name||data.user.username)+'! Redirecting...','success');setTimeout(()=>{window.location.href='/' + data.user.role.toLowerCase();},550);}).catch(err=>{showMsg('❌ '+err.message,'error');newCaptcha();});});
</script>
