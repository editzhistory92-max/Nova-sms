<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="/assets/nova-favicon.png?v=nova-20260728-1"><title>NOVA SMS — Payment Login</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#12051f;font-family:Inter,Segoe UI,Arial;color:#1f1735}.card{width:min(420px,92vw);background:#fff;border:1px solid #e9d5ff;border-radius:22px;box-shadow:0 28px 90px rgba(0,0,0,.28);padding:28px}.logo{width:76px;height:76px;border-radius:18px;background:#14031f;margin-bottom:14px;overflow:hidden}.logo img{width:100%;height:100%;object-fit:cover}h1{margin:0;font-size:24px}.sub{color:#6b5d7d;margin:6px 0 20px}label{display:block;font-weight:800;font-size:13px;margin:13px 0 7px}input{width:100%;height:44px;border:1px solid #ddd6fe;border-radius:12px;padding:0 12px;font-size:14px;box-sizing:border-box}button{width:100%;height:46px;border:0;border-radius:12px;background:linear-gradient(135deg,#7c3aed,#a855f7);color:#fff;font-weight:900;margin-top:18px;cursor:pointer}.msg{margin-top:12px;font-size:13px}.err{color:#b91c1c}.ok{color:#047857}</style><link rel="stylesheet" href="/assets/nova-login.css?v=nova-20260728-1" />
</head><body><div class="card"><div class="logo"><img src="/assets/nova-logo.png?v=nova-20260728-1"></div><h1>Payment Panel</h1><div class="sub">Admin only — isolated payment management</div><form id="form"><label>Username</label><input id="username" autocomplete="username"><label>Password</label><input id="password" type="password" autocomplete="current-password"><button>Login</button><div id="msg" class="msg"></div></form></div><script>function msg(t,c){const m=document.getElementById('msg');m.className='msg '+(c||'');m.textContent=t}document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();msg('Checking...','ok');try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:username.value.trim(),password:password.value})});const data=await r.json().catch(()=>({}));if(!r.ok)throw new Error(data.error||'Login failed');if(data.user.role!=='admin')throw new Error('Payment Panel requires Admin account.');sessionStorage.setItem('ms_token',data.token);sessionStorage.setItem('ms_role',data.user.role);sessionStorage.setItem('ms_user',data.user.username);sessionStorage.setItem('ms_name',data.user.name||data.user.username);localStorage.setItem('ms_token',data.token);localStorage.setItem('ms_role',data.user.role);localStorage.setItem('ms_user',data.user.username);localStorage.setItem('ms_name',data.user.name||data.user.username);localStorage.setItem('ms_last_page_payment','dashboard');location.href='/payment';}catch(err){msg('❌ '+err.message,'err')}});</script></body></html>
